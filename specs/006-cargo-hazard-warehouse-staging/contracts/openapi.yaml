openapi: 3.1.0
info:
  title: JalSetu Feature 006
  version: 1.0.0
  description: Generated from the running app.
paths:
  /api/match:
    post:
      summary: Match Cargo
      operationId: match_cargo_api_match_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/book:
    post:
      summary: Create Booking
      operationId: create_booking_api_book_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/book/{booking_id}/confirm:
    post:
      summary: Confirm Booking
      description: Explicit human confirmation step — Constitution P7.
      operationId: confirm_booking_api_book__booking_id__confirm_post
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/booking/{booking_id}/deliver:
    post:
      summary: Deliver Booking
      description: 'Mark a booking delivered: append a delivery record, recompute
        reliability (Feature 004).'
      operationId: deliver_booking_api_booking__booking_id__deliver_post
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          title: Booking Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/compliance/review/{booking_id}/approve:
    post:
      summary: Approve Compliance Review
      description: 'Approve a compliance review for a hazmat booking [simulated].

        Transitions booking from pending_review → pending.


        Demo action — no authentication required.

        UI must label this: "Compliance review — simulated; production requires a
        qualified person."


        Returns structured error codes (not exceptions) for:

        - compliance_already_reviewed: booking not in pending_review state

        - review_not_required_for_class: cargo class does not require review'
      operationId: approve_compliance_review_api_compliance_review__booking_id__approve_post
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          title: Booking Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceReviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/warehouse/list:
    get:
      summary: List Warehouses
      description: 'List all registered warehouses. All carry source_status: simulated
        (P13).'
      operationId: list_warehouses_api_warehouse_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/warehouse/register:
    post:
      summary: Register Warehouse
      description: Register a new warehouse node (FR-4).
      operationId: register_warehouse_api_warehouse_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/warehouse/stage:
    post:
      summary: Propose Staging
      description: 'Propose a staging plan (read-only). FR-8: only offered when wait
        >= threshold. P12.'
      operationId: propose_staging_api_warehouse_stage_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StagingProposalRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/warehouse/stage/confirm:
    post:
      summary: Confirm Staging
      description: Confirm a staging proposal; applies capacity change. FR-7, P12.
      operationId: confirm_staging_api_warehouse_stage_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StagingConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/warehouse/utilisation:
    get:
      summary: Warehouse Utilisation
      description: Warehouse utilisation summary [simulated]. Resets on demo reset
        (FR-11, P13).
      operationId: warehouse_utilisation_api_warehouse_utilisation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/bookings:
    get:
      summary: List Bookings
      operationId: list_bookings_api_bookings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/booking/{booking_id}:
    get:
      summary: Get Booking
      operationId: get_booking_api_booking__booking_id__get
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/booking/{booking_id}/notify:
    post:
      summary: Notify
      description: Render the notification template for the latest disruption. Never
        sends anything.
      operationId: notify_api_booking__booking_id__notify_post
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BookingRequest:
      properties:
        cargo_id:
          type: string
          title: Cargo Id
        sailing_id:
          type: string
          title: Sailing Id
        deadline_h:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deadline H
          description: Hours from ready_time; defaults to demo config
        ready_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          title: Ready Time
          description: HH:MM IST
          default: 06:00
        human_confirmed:
          type: boolean
          title: Human Confirmed
          description: Must be True to confirm booking
          default: false
      type: object
      required:
      - cargo_id
      - sailing_id
      title: BookingRequest
    CargoCreateRequest:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        weight_t:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Weight T
        cargo_class:
          anyOf:
          - type: string
          - type: 'null'
          title: Cargo Class
          default: general
        origin_node_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Node Id
        destination_node_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Node Id
      type: object
      title: CargoCreateRequest
    ComplianceReviewRequest:
      properties:
        reviewer_note:
          type: string
          title: Reviewer Note
      type: object
      required:
      - reviewer_note
      title: ComplianceReviewRequest
    DeliverRequest:
      properties:
        actual_arrival:
          anyOf:
          - type: string
          - type: 'null'
          title: Actual Arrival
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      type: object
      title: DeliverRequest
    DisruptRequest:
      properties:
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
        location_node_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Node Id
        expected_duration_h:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Expected Duration H
        now_hhmm:
          anyOf:
          - type: string
          - type: 'null'
          title: Now Hhmm
          description: Demo/test override, HH:MM IST
      type: object
      title: DisruptRequest
    ExcludedSailing:
      properties:
        sailing_id:
          type: string
          title: Sailing Id
        vessel_id:
          type: string
          title: Vessel Id
        reason:
          type: string
          title: Reason
      type: object
      required:
      - sailing_id
      - vessel_id
      - reason
      title: ExcludedSailing
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MatchRequest:
      properties:
        cargo_id:
          type: string
          title: Cargo Id
        sailing_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sailing Ids
        cargo_class:
          anyOf:
          - type: string
          - type: 'null'
          title: Cargo Class
          description: Override; defaults to the cargo record class, then 'general'
      type: object
      required:
      - cargo_id
      title: MatchRequest
    MatchResponse:
      properties:
        cargo_id:
          type: string
          title: Cargo Id
        ranked:
          items:
            $ref: '#/components/schemas/MatchedSailing'
          type: array
          title: Ranked
        excluded:
          items:
            $ref: '#/components/schemas/ExcludedSailing'
          type: array
          title: Excluded
      type: object
      required:
      - cargo_id
      - ranked
      title: MatchResponse
    MatchedSailing:
      properties:
        sailing_id:
          type: string
          title: Sailing Id
        vessel_id:
          type: string
          title: Vessel Id
        departure_time:
          type: string
          title: Departure Time
        available_capacity_t:
          type: number
          title: Available Capacity T
        score:
          type: number
          title: Score
      type: object
      required:
      - sailing_id
      - vessel_id
      - departure_time
      - available_capacity_t
      - score
      title: MatchedSailing
    OperatorMessageRequest:
      properties:
        operator_id:
          type: string
          title: Operator Id
        message:
          type: string
          title: Message
      type: object
      required:
      - operator_id
      - message
      title: OperatorMessageRequest
    OptionsRequest:
      properties:
        weight_t:
          type: number
          exclusiveMinimum: 0.0
          title: Weight T
          description: Shipment weight in tonnes
        origin_node_id:
          type: string
          title: Origin Node Id
        destination_node_id:
          type: string
          title: Destination Node Id
        ready_time:
          type: string
          title: Ready Time
          description: Ready time HH:MM IST
          default: 06:00
        deadline_h:
          type: number
          exclusiveMinimum: 0.0
          title: Deadline H
          description: Deadline in hours from ready_time
        subsidy:
          type: boolean
          title: Subsidy
          description: Apply water subsidy scenario (OFF by default)
          default: false
      type: object
      required:
      - weight_t
      - origin_node_id
      - destination_node_id
      - deadline_h
      title: OptionsRequest
    OptionsResponse:
      properties:
        plans:
          additionalProperties:
            $ref: '#/components/schemas/PlanDetail'
          type: object
          title: Plans
        recommended:
          type: string
          title: Recommended
        scores:
          additionalProperties:
            type: number
          type: object
          title: Scores
        why:
          type: string
          title: Why
      type: object
      required:
      - plans
      - recommended
      - scores
      - why
      title: OptionsResponse
    ParseRequest:
      properties:
        text:
          type: string
          title: Text
          description: Free-text shipment request from shipper/operator
      type: object
      required:
      - text
      title: ParseRequest
    ParsedShipment:
      properties:
        weight_t:
          anyOf:
          - type: number
          - type: 'null'
          title: Weight T
        origin_raw:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Raw
        destination_raw:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Raw
        origin_node_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Node Id
        destination_node_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Node Id
        deadline_raw:
          anyOf:
          - type: string
          - type: 'null'
          title: Deadline Raw
        deadline_h:
          anyOf:
          - type: number
          - type: 'null'
          title: Deadline H
        confidence:
          type: number
          title: Confidence
          default: 0.0
        needs_review:
          type: boolean
          title: Needs Review
          default: true
        method:
          type: string
          title: Method
          default: regex
      type: object
      title: ParsedShipment
    PlanDetail:
      properties:
        mode:
          type: string
          title: Mode
        cost_inr:
          type: number
          title: Cost Inr
        time_h:
          type: number
          title: Time H
        co2_kg:
          type: number
          title: Co2 Kg
        distance_km:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance Km
        source_status:
          type: string
          title: Source Status
        note:
          type: string
          title: Note
        subsidy_applied:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Subsidy Applied
        wait_h:
          anyOf:
          - type: number
          - type: 'null'
          title: Wait H
        sail_time_h:
          anyOf:
          - type: number
          - type: 'null'
          title: Sail Time H
        sailing_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sailing Id
      type: object
      required:
      - mode
      - cost_inr
      - time_h
      - co2_kg
      - source_status
      - note
      title: PlanDetail
    ReplanConfirmRequest:
      properties:
        alternative_id:
          type: string
          title: Alternative Id
      type: object
      required:
      - alternative_id
      title: ReplanConfirmRequest
    ReplanReviewRequest:
      properties:
        reviewer_note:
          type: string
          title: Reviewer Note
      type: object
      required:
      - reviewer_note
      title: ReplanReviewRequest
    SailingPublishRequest:
      properties:
        vessel_id:
          type: string
          title: Vessel Id
        route_node_ids:
          items:
            type: string
          type: array
          title: Route Node Ids
        weekdays:
          items:
            type: string
          type: array
          title: Weekdays
        departure_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Departure Time
        price_per_t:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Price Per T
        capacity_offered_t:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Capacity Offered T
      type: object
      required:
      - vessel_id
      title: SailingPublishRequest
    StagingConfirmRequest:
      properties:
        proposal_id:
          type: string
          title: Proposal Id
      type: object
      required:
      - proposal_id
      title: StagingConfirmRequest
    StagingProposalRequest:
      properties:
        cargo_id:
          type: string
          title: Cargo Id
        next_sailing_wait_h:
          type: number
          title: Next Sailing Wait H
        deadline_h:
          type: number
          title: Deadline H
        booking_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Booking Id
      type: object
      required:
      - cargo_id
      - next_sailing_wait_h
      - deadline_h
      title: StagingProposalRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VesselMessageRequest:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: VesselMessageRequest
    VesselRegisterRequest:
      properties:
        vessel_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vessel Name
        registration_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Registration Number
          description: Placeholder - not validated
        vessel_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Vessel Type
        capacity_t:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Capacity T
        draft_m:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Draft M
        home_jetty_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Home Jetty Id
        hazard_certs:
          items:
            type: string
          type: array
          title: Hazard Certs
        contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact
        operator_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator Id
      type: object
      title: VesselRegisterRequest
    ViabilityResponse:
      properties:
        d_star_km:
          type: number
          title: D Star Km
        corridors:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Corridors
        demand_summary:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Demand Summary
      type: object
      required:
      - d_star_km
      - corridors
      - demand_summary
      title: ViabilityResponse
    WarehouseRegisterRequest:
      properties:
        name:
          type: string
          title: Name
        location_node_id:
          type: string
          title: Location Node Id
        total_capacity_t:
          type: number
          title: Total Capacity T
        storage_cost_per_t_per_day:
          type: number
          title: Storage Cost Per T Per Day
        handling_in_cost_per_t:
          type: number
          title: Handling In Cost Per T
        handling_out_cost_per_t:
          type: number
          title: Handling Out Cost Per T
        allowed_cargo_classes:
          items:
            type: string
          type: array
          title: Allowed Cargo Classes
      type: object
      required:
      - name
      - location_node_id
      - total_capacity_t
      - storage_cost_per_t_per_day
      - handling_in_cost_per_t
      - handling_out_cost_per_t
      - allowed_cargo_classes
      title: WarehouseRegisterRequest
